; Copy to config.ini and edit. NEVER commit config.ini (it is in .gitignore).
; Inline comments must start with " ;" (space, semicolon).

[discord]
; Bot token from the Developer Portal (Bot tab -> Reset Token).
; Prefer the environment variable DISCORD_TOKEN, which overrides this value.
; Do NOT wrap the token in quotes.
token = "Set ur discord token"
; Guild that is scanned for "<name><suffix>" channels. `get` reads from here.
source_guild_id = "Set channel ID"
; Guild that `set` uploads to. May equal source_guild_id.
; If different, the bot must be a member of BOTH guilds.
target_guild_id = "Set channel ID"


[commands]
; A text channel whose name ends with this is an image pool.
; "bae-dump" with suffix "-dump" -> command "bae".
suffix = -dump
; Prefix users type before a command, e.g. !bae
prefix = !

[behavior]
; Which image `get` shows first: random | newest
get_strategy = random
; Max messages read per channel when (re)building the index. Bounded on purpose.
backfill_limit = 200
; Max images loaded into one browsing session (newest N).
pool_snapshot_limit = 2000
; Seconds the bot waits for the user's image after `<name> set`.
session_timeout_seconds = 90
; Seconds the user has to press Confirm on the preview.
confirm_timeout_seconds = 60
; Seconds the arrow buttons stay active after `get`.
view_timeout_seconds = 300
; How long a resolved CDN URL is reused (Discord URLs expire; keep <= 3600).
url_cache_seconds = 600
; Minimum seconds between commands per user.
cooldown_seconds = 2
; Upload size cap in MB (also capped by the target guild's own limit).
max_upload_mb = 8

[security]
; true  = user must be a member of the relevant guild AND be allowed to see
;         (get) or post in (set) the channel. Strongly recommended.
; false = anyone who can DM the bot can read/write the pools.
enforce_membership = false

[storage]
; SQLite index of message/attachment IDs (no image bytes, no content).
database_path = data/index.db

[logging]
; DEBUG | INFO | WARNING | ERROR | CRITICAL
level = INFO
